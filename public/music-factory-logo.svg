<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="100%" height="100%">
  <defs>
    <!-- Drop Shadow for the Music Note -->
    <filter id="note-shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="3.5" dy="4.5" stdDeviation="3.5" flood-color="#000000" flood-opacity="0.32"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1000" height="360" fill="#FFFFFF"/>

  <!-- Outer Border Frame -->
  <rect x="8" y="8" width="984" height="344" fill="none" stroke="#FAA61A" stroke-width="6" rx="2"/>

  <!-- "THE" Text -->
  <text x="42" y="98" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="64" font-weight="600" fill="#000000" letter-spacing="3">THE</text>

  <!-- Gear / Cog Wheel -->
  <path d="M 161.55 150.06 A 86 86 0 0 1 188.45 150.06 L 190.87 168.88 A 68 68 0 0 1 210.53 177.02 L 225.55 165.43 A 86 86 0 0 1 244.57 184.45 L 233.01 199.47 A 68 68 0 0 1 241.12 219.13 L 259.94 221.55 A 86 86 0 0 1 259.94 248.45 L 241.12 250.87 A 68 68 0 0 1 233.01 270.53 L 244.57 285.55 A 86 86 0 0 1 225.55 304.57 L 210.53 292.98 A 68 68 0 0 1 190.87 301.12 L 188.45 319.94 A 86 86 0 0 1 161.55 319.94 L 159.13 301.12 A 68 68 0 0 1 139.47 292.98 L 125.43 304.57 A 86 86 0 0 1 105.43 285.55 L 116.99 270.53 A 68 68 0 0 1 108.88 250.87 L 90.06 248.45 A 86 86 0 0 1 90.06 221.55 L 108.88 219.13 A 68 68 0 0 1 116.99 199.47 L 105.43 184.45 A 86 86 0 0 1 125.43 165.43 L 139.47 177.02 A 68 68 0 0 1 159.13 168.88 Z" fill="#FAA61A" stroke="#000000" stroke-width="3.5" stroke-linejoin="round"/>

  <!-- Gear Inner Hole -->
  <circle cx="175" cy="235" r="42" fill="#FFFFFF" stroke="#000000" stroke-width="3.5"/>

  <!-- Music Note (Solid Quaver / 1/8th Note) -->
  <g filter="url(#note-shadow)">
    <!-- Solid Note Head -->
    <ellipse cx="172" cy="240" rx="27" ry="18" transform="rotate(-26 172 240)" fill="#000000"/>

    <!-- Vertical Stem -->
    <rect x="197" y="45" width="13" height="195" fill="#000000"/>

    <!-- Flag Hook -->
    <path d="M 210 45 C 232 42, 260 55, 264 92 C 250 72, 228 68, 210 78 Z" fill="#000000"/>
  </g>

  <!-- "MUSIC" Text -->
  <text x="295" y="180" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="152" font-weight="400" fill="#000000" letter-spacing="2">MUSIC</text>

  <!-- "FACTORY" Text -->
  <text x="295" y="312" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="132" font-weight="400" fill="#000000" letter-spacing="1">FACTORY</text>

  <!-- "cic" Text -->
  <text x="832" y="312" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="68" font-weight="400" fill="#000000">cic</text>
</svg>
