<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chord Formatter</title>
  <meta name="theme-color" content="#20313d">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="./logo.svg?v=2">
  <link rel="stylesheet" href="/src/styles/styles.css">
</head>
<body>
  <header class="app-header">
    <div class="app-header-inner">
      <div class="app-title">
        <img class="app-logo" src="./logo.svg?v=2" alt="Music note logo">
        <div>
          <h1>Chord Formatter</h1>
          <p>Shape, transpose, and export your chord sheets</p>
        </div>
      </div>
      <a class="partner-link" href="https://www.themusicfactory.org.uk" target="_blank" rel="noopener noreferrer">
        <span>Developed for</span>
        <img src="./music-factory-logo.svg" alt="The Music Factory CIC">
      </a>
    </div>
  </header>
  <main class="app-main">
    <div class="toolbar toolbar-primary" aria-label="Chord editing tools">
      <div class="toolbar-group">
        <span class="toolbar-label">Format</span>
        <button id="undoBtn" type="button" disabled title="Undo last editor action">Undo</button>
        <button id="markBtn">Mark Chords</button>
        <button id="unMarkBtn">Unmark</button>
        <button id="nestBtn">Nest Chords</button>
        <button id="unNestBtn">Unnest</button>
        <button id="rmEmptyBtn">Remove Empty Lines</button>
      </div>
      <div class="toolbar-group">
        <span class="toolbar-label">Key</span>
        <button id="transUpBtn">Transpose Up</button>
        <button id="transDownBtn">Transpose Down</button>
      </div>
      <button id="loadExampleBtn" class="button-quiet">Load Example</button>
    </div>
    <div class="toolbar toolbar-secondary" aria-label="Document options">
      <div class="toolbar-group document-actions">
        <button id="generateButton" class="button-primary">Generate Word ZIP</button>
        <button id="configBtn" class="button-secondary">Configurations</button>
      </div>
      <label class="field-inline" for="filename">
        <span>Song name</span>
        <input type="text" id="filename" placeholder="Enter song name...">
      </label>
      <label class="toggle-field" for="autoBreak">
        <input type="checkbox" id="autoBreak" name="autoBreak" checked>
        <span>Auto-break</span>
      </label>
      <label class="field-inline field-number" for="tabSpaces">
        <span>Tab spaces</span>
        <input type="number" id="tabSpaces" name="tabSpaces" value="4" min="0" step="1">
      </label>
    </div>
    <div class="editor-wrap">
      <div class="editor-hint">Chord sheet</div>
      <div id="editor" contenteditable="true" aria-label="Chord sheet editor"></div>
    </div>
  </main>
  <footer class="status-bar">
    <output id="status" aria-live="polite"></output>
    <button id="installButton" type="button" hidden>Install as desktop app</button>
  </footer>
  <dialog id="configModal" aria-labelledby="configModalTitle">
    <form method="dialog" class="config-modal-content">
      <div class="config-modal-header">
        <h2 id="configModalTitle">Configurations</h2>
        <button type="submit" aria-label="Close configurations">Close</button>
      </div>
      <div id="configurations"></div>
      <output id="config-status" aria-live="polite"></output>
      <div class="config-modal-actions">
        <button id="add-config" type="button">Add Configuration</button>
        <button id="default-configurations" type="button">Set Defaults</button>
        <button id="export-configurations" type="button">Export JSON</button>
        <button id="import-configurations" type="button">Import JSON</button>
        <label class="visually-hidden" for="config-file-input">Configuration JSON file</label>
        <input id="config-file-input" type="file" accept="application/json,.json" hidden>
        <button id="save-configurations" type="button">Save Configurations</button>
      </div>
    </form>
  </dialog>
  <script type="module" src="/src/pages/main.js"></script>
  <script type="module" src="/src/pages/config.js"></script>
</body>
</html>
