<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chord Formatter</title>
  <link rel="stylesheet" href="/src/styles/styles.css">
</head>
<body>
  <div class="toolbar">
    <button id="markBtn">Mark Chords</button>
    <button id="unMarkBtn">UnMark Chords</button>
    <button id="nestBtn">Nest Chords</button>
    <button id="unNestBtn">UnNest Chords</button>
    <button id="rmEmptyBtn">Remove Empty Lines</button>
    <button id="transUpBtn">Transpose Up</button>
    <button id="transDownBtn">Transpose Down</button>
    <button id="loadExampleBtn">Load Example</button>
  </div>
  <div class="toolbar">
    <button id="generateButton">Generate Word Document</button>
    <button id="configBtn">Open configurations</button>
    <div>
      <label for="filename">Song Name:</label>
      <input type="text" id="filename" placeholder="Enter song name...">
    </div>
    <label for="autoBreak">AutoBreak:</label>
    <input type="checkbox" id="autoBreak" name="autoBreak" checked>
  </div>
  <p id="status"></p>
  <div id="editor" contenteditable="true" aria-label="Chord sheet editor"></div>
  <dialog id="configModal" aria-labelledby="configModalTitle">
    <form method="dialog" class="config-modal-content">
      <div class="config-modal-header">
        <h2 id="configModalTitle">Configurations</h2>
        <button type="submit" aria-label="Close configurations">Close</button>
      </div>
      <div id="configurations"></div>
      <output id="config-status" aria-live="polite"></output>
      <div class="config-modal-actions">
        <button id="add-config" type="button">Add Configuration</button>
        <button id="default-configurations" type="button">Set Defaults</button>
        <button id="export-configurations" type="button">Export JSON</button>
        <button id="import-configurations" type="button">Import JSON</button>
        <label class="visually-hidden" for="config-file-input">Configuration JSON file</label>
        <input id="config-file-input" type="file" accept="application/json,.json" hidden>
        <button id="save-configurations" type="button">Save Configurations</button>
      </div>
    </form>
  </dialog>
  <script type="module" src="/src/pages/main.js"></script>
  <script type="module" src="/src/pages/config.js"></script>
</body>
</html>
