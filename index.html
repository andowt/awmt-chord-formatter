<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chord Formatter</title>
  <link rel="stylesheet" href="/src/stylesheets/styles.css">
</head>
<body>
  <div class="toolbar">
    <button id="markBtn">Mark Chords</button>
    <button id="unMarkBtn">UnMark Chords</button>
    <button id="nestBtn">Nest Chords</button>
    <button id="unNestBtn">UnNest Chords</button>
    <button id="rmEmptyBtn">Remove Empty Lines</button>
    <button id="transUpBtn">Transpose Up</button>
    <button id="transDownBtn">Transpose Down</button>
    <button id="loadExampleBtn">Load Example</button>
  </div>
  <div class="toolbar">
    <button id="generateButton">Generate Word Document</button>
    <button id="configBtn">Open configurations</button>
    <div>
      <label for="filename">Song Name:</label>
      <input type="text" id="filename" placeholder="Enter song name...">
    </div>
    <label for="autoBreak">AutoBreak:</label>
    <input type="checkbox" id="autoBreak" name="autoBreak" checked>
  </div>
  <p id="status"></p>
  <div id="editor" contenteditable="true" aria-label="Chord sheet editor"></div>
  <script type="module" src="/src/windowMain/windowMain.js"></script>
</body>
</html>
